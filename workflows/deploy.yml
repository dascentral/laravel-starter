name: Production Deploy

on:
  release:
    types: [published]

jobs:
  audit:
    uses: dascentral/reusable-workflows/.github/workflows/composer-audit.yml@e4a164e115d74ac0f585c9b4205163b2d4fc01c8 # v0.6.0
    with:
      php-version: '8.4'

  tests:
    uses: dascentral/reusable-workflows/.github/workflows/laravel-tests.yml@e4a164e115d74ac0f585c9b4205163b2d4fc01c8 # v0.6.0
    with:
      node-version: '22.20.0'
      php-version: '8.4'
      mysql-image: 'mysql:8.0'
    secrets:
      composer-auth: ${{ secrets.COMPOSER_AUTH }}

  deploy:
    needs: [tests, audit]
    uses: dascentral/reusable-workflows/.github/workflows/laravel-deploy.yml@e4a164e115d74ac0f585c9b4205163b2d4fc01c8 # v0.6.0
    with:
      php-version: '8.4'
      node-version: '22.20.0'
      ssh-user: ${{ vars.SSH_USER }}
      ssh-host: ${{ vars.SSH_HOST }}
      destination-path: ${{ vars.DESTINATION_PATH }}
    secrets:
      composer-auth: ${{ secrets.COMPOSER_AUTH }}
      ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
