name: Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  branch-validation:
    uses: dascentral/reusable-workflows/.github/workflows/branch-validation.yml@e4a164e115d74ac0f585c9b4205163b2d4fc01c8 # v0.6.0

  lint:
    uses: dascentral/reusable-workflows/.github/workflows/laravel-lint.yml@e4a164e115d74ac0f585c9b4205163b2d4fc01c8 # v0.6.0
    with:
      node-version: '22.20.0'
      php-version: '8.4'
      commit-changes: true
    secrets:
      composer-auth: ${{ secrets.COMPOSER_AUTH }}

  analyze:
    uses: dascentral/reusable-workflows/.github/workflows/laravel-analyze.yml@e4a164e115d74ac0f585c9b4205163b2d4fc01c8 # v0.6.0
    with:
      php-version: '8.4'
    secrets:
      composer-auth: ${{ secrets.COMPOSER_AUTH }}

  tests:
    uses: dascentral/reusable-workflows/.github/workflows/laravel-tests.yml@e4a164e115d74ac0f585c9b4205163b2d4fc01c8 # v0.6.0
    with:
      node-version: '22.20.0'
      php-version: '8.4'
      mysql-image: 'mysql:8.0'
    secrets:
      composer-auth: ${{ secrets.COMPOSER_AUTH }}
